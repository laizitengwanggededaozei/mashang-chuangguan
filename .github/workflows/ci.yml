name: CI

# 四道护栏: 内核自测 / 题库校验(按章并行) / 前端冒烟 / 端到端
# 判题内核需要真实 JDK, 因此每个 job 都安装 Temurin 21。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  self-test:
    name: 内核自测 + 前端冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 环境自检
        run: |
          node --version
          java -version
          javac -version

      - name: 判题内核自测(20 判决 + 5 比较器)
        run: node tools/judge-selftest.mjs

      - name: 前端冒烟(地图/开卡/提交/成就/BOSS/分层提示)
        run: node tools/ui-smoke.mjs

  bank:
    name: 题库校验 ch${{ matrix.ch }}
    runs-on: ubuntu-latest
    needs: self-test
    strategy:
      fail-fast: false
      matrix:
        ch: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12', '13', '14']
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验第 ${{ matrix.ch }} 章
        run: node tools/verify-problems.mjs data/problems/ch${{ matrix.ch }}.js

  e2e:
    name: 端到端
    runs-on: ubuntu-latest
    needs: self-test
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 启动服务并跑端到端
        run: |
          node tools/serve.mjs 4319 &
          SERVER_PID=$!
          # 等服务监听起来(最多 20 秒)
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4319/api/problems > /dev/null; then break; fi
            sleep 1
          done
          node tools/e2e-check.mjs
          STATUS=$?
          kill $SERVER_PID || true
          exit $STATUS
